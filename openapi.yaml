openapi: 3.1.0
info:
  title: RunPod Control Bridge
  version: 1.0.0
  description: Control a configured RunPod pod and submit jobs to a configured Serverless endpoint.
servers:
  - url: https://trellis-runpod.vercel.app
components:
  securitySchemes:
    ActionToken:
      type: http
      scheme: bearer
  schemas:
    ActionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [create_pod, start_pod, stop_pod, terminate_pod, submit_job]
        gpu_type_id:
          type: string
        cloud_type:
          type: string
          enum: [COMMUNITY, SECURE]
        max_cost_per_hr:
          type: number
        pod_id:
          type: string
        input:
          type: object
          description: Serverless endpoint-specific input payload for submit_job
          additionalProperties: true
security:
  - ActionToken: []
paths:
  /api/runpod:
    get:
      operationId: checkRunpod
      summary: List pods, inspect GPU types, or check a RunPod job
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [pods, gpu_types, job_status]
        - name: job_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: RunPod response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
                    description: RunPod result data
                  error:
                    type: string
                  id:
                    type: string
                  status:
                    type: string
                additionalProperties: true
    post:
      operationId: operateRunpod
      summary: Create, start, stop or terminate a pod, or submit a serverless job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: RunPod response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
                    description: RunPod result data
                  error:
                    type: string
                  id:
                    type: string
                  status:
                    type: string
                additionalProperties: true
