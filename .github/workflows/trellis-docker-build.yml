name: TRELLIS Docker CPU Build

on:
  push:
    branches:
      - fix/trellis-safe-build-preflight-20261009
    paths:
      - Dockerfile
      - constraints-trellis.txt
      - 'scripts/**'
      - '.github/workflows/trellis-docker-build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    name: Build and verify Docker image without rented GPU
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Free disk space on temporary runner
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/powershell
          sudo apt-get clean
          docker system prune --all --force
          df -h

      - name: Docker build including pip check and TRELLIS imports
        run: |
          set -o pipefail
          docker build --progress=plain --tag secret-mission-trellis:cpu-verified .
          docker image inspect secret-mission-trellis:cpu-verified --format 'Image ID: {{.Id}}  Size: {{.Size}}'

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SOURCE_SHA="$(git rev-parse HEAD)"
          VERSION="cuda118-${SOURCE_SHA:0:12}"
          docker tag secret-mission-trellis:cpu-verified "${IMAGE}:${VERSION}"
          docker tag secret-mission-trellis:cpu-verified "${IMAGE}:cuda118-verified"
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:cuda118-verified"
          echo "Published ${IMAGE}:${VERSION}"
      - name: Show disk utilization
        if: always()
        run: df -h
