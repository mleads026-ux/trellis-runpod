name: TRELLIS no-GPU preflight
on:
  pull_request:
  push:
    branches: [main, "fix/**"]
  workflow_dispatch:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Pillow for upload validation tests
        run: python -m pip install 'Pillow==10.4.0'
      - name: Run offline syntax and dependency checks
        run: python -m unittest discover -s tests -v
