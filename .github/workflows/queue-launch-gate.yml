name: RunPod queue safety gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/queue_launch_gate.py'
      - '.github/workflows/queue-launch-gate.yml'

permissions:
  contents: read

jobs:
  fail-closed-queue-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify queue is blocked without proven safeguards
        run: |
          if python scripts/queue_launch_gate.py > gate.json; then
            echo 'ERROR: queue allowed without safety evidence'
            exit 1
          fi
          python -c 'import json; r=json.load(open("gate.json")); assert r["safe_to_queue"] is False'
      - name: Verify incomplete approval remains blocked
        run: |
          if python scripts/queue_launch_gate.py --live-price-verified --storage-verified --user-approved-auto-start; then
            echo 'ERROR: incomplete safeguards accepted'
            exit 1
          fi
      - name: Validate syntax
        run: python -m py_compile scripts/queue_launch_gate.py
      - name: Summary
        run: echo 'Tests passed means the unsafe queue is correctly BLOCKED; not approved to deploy.'
