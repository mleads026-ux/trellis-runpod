name: TRELLIS Studio secure integration tests

on:
  push:
    branches: [fix/trellis-safe-build-preflight-20261009]
    paths:
      - src/trellis-studio-worker.js
      - tests/trellis-studio.test.mjs
      - .github/workflows/trellis-studio-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check Cloudflare Worker
        run: node --check src/trellis-studio-worker.js
      - name: Run browser-to-RunPod and R2 auth tests
        run: node --experimental-default-type=module --test tests/trellis-studio.test.mjs
