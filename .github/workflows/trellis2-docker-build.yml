name: TRELLIS.2 Docker build
on:
  push:
    branches: ["upgrade/trellis2-20261014"]
    paths:
      - Dockerfile.trellis2
      - constraints-trellis2.txt
      - 'scripts/**'
      - 'tests/test_trellis2.py'
      - .github/workflows/trellis2-docker-build.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: trellis2-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run offline tests
        run: |
          python -m pip install Pillow==10.4.0
          python -m unittest discover -s tests -v
      - name: Free temporary runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/powershell
          sudo apt-get clean
          docker system prune -af
      - name: Build CUDA 12.4 image without a rented GPU
        run: docker build --progress=plain -f Dockerfile.trellis2 -t trellis2:checked .
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish separate TRELLIS.2 tags
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="trellis2-cu124-${GITHUB_SHA:0:12}"
          docker tag trellis2:checked "${IMAGE}:${VERSION}"
          docker tag trellis2:checked "${IMAGE}:trellis2-verified"
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:trellis2-verified"
          echo "${IMAGE}:${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo 'CPU build verified; GPU inference and gated model access still require runtime validation.' >> "$GITHUB_STEP_SUMMARY"
