name: Verify RunPod anonymous GHCR pull

on:
  workflow_dispatch:
  push:
    branches:
      - fix/trellis-safe-build-preflight-20261009
    paths:
      - .github/workflows/verify-ghcr-anonymous.yml

permissions:
  contents: read

jobs:
  registry-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check published GHCR tags as unauthenticated RunPod would
        env:
          IMAGE: ghcr.io/mleads026-ux/trellis-runpod
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          image = os.environ["IMAGE"]
          registry_path = image.split("ghcr.io/", 1)[1]
          query = urllib.parse.urlencode({"scope": f"repository:{registry_path}:pull", "service": "ghcr.io"})
          with urllib.request.urlopen("https://ghcr.io/token?" + query, timeout=20) as response:
              token = json.load(response).get("token")
          if not token:
              raise SystemExit("FAIL: GHCR did not provide anonymous pull token; package may be private")
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": ", ".join((
                  "application/vnd.oci.image.index.v1+json",
                  "application/vnd.docker.distribution.manifest.list.v2+json",
                  "application/vnd.oci.image.manifest.v1+json",
                  "application/vnd.docker.distribution.manifest.v2+json",
              )),
          }
          all_ok = True
          for tag in ("cuda118-e06bbe782e63", "cuda118-verified", "cuda118-25fd2e38d3ea"):
              url = f"https://ghcr.io/v2/{registry_path}/manifests/{tag}"
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = json.load(response)
                      digest = response.headers.get("Docker-Content-Digest")
                      schema = response.headers.get("Content-Type")
                  print(f"PUBLIC_OK {tag}: digest={digest}, manifest={schema}")
                  if "manifests" in data:
                      platforms = [f"{m.get('platform',{}).get('os')}/{m.get('platform',{}).get('architecture')}" for m in data["manifests"]]
                      print(f"PLATFORMS {tag}: {platforms}")
              except urllib.error.HTTPError as exc:
                  print(f"PUBLIC_FAIL {tag}: HTTP {exc.code}")
                  if tag != "cuda118-25fd2e38d3ea":
                      all_ok = False
          if not all_ok:
              raise SystemExit("New RunPod image still inaccessible anonymously. Make GHCR package public or configure registry authentication.")
          PY
