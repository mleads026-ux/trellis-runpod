name: Watchdog safety tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/watchdog.js'
      - 'tests/watchdog.test.mjs'
      - '.github/workflows/watchdog-tests.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run mock watchdog tests (no RunPod access)
        run: node --experimental-default-type=module --test tests/watchdog.test.mjs
