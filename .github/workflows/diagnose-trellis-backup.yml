name: Diagnose TRELLIS R2 upload HTTP failure

on:
  push:
    branches: [fix/trellis-safe-build-preflight-20261009]
    paths: [.github/workflows/diagnose-trellis-backup.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KEY: ${{ secrets.STORAGE_TEST_API_KEY }}
    steps:
      - name: Test exact live GLB Worker route without any GPU usage
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KEY}" ]]; then
            echo "::error::STORAGE_TEST_API_KEY GitHub secret is missing; live secret test skipped"
            exit 1
          fi
          echo "::add-mask::${KEY}"
          python - <<'PY'
          import json,os,struct,urllib.request,urllib.error,hashlib
          doc=b'{"asset":{"version":"2.0"}}'
          doc+=b' '*((-len(doc))%4)
          raw=struct.pack('<4sII',b'glTF',2,20+len(doc))+struct.pack('<I4s',len(doc),b'JSON')+doc
          url="https://trellis-runpod-api.mleads026.workers.dev/api/models/diagnostic-"+os.environ["GITHUB_RUN_ID"]+".glb"
          def send(method,key=None,user_agent=None):
            headers={"Content-Type":"model/gltf-binary"}
            if user_agent: headers["User-Agent"]=user_agent
            if key is not None: headers["Authorization"]="Bearer "+key
            req=urllib.request.Request(url,headers=headers,method=method,data=raw if method=="PUT" else None)
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                payload=r.read(512)
                return (r.status,payload)
            except urllib.error.HTTPError as e:
              return(e.code,e.read(512))
          status,body=send("PUT",key=None)
          print("Unauthenticated PUT HTTP",status,"body",body.decode("utf-8","replace")[:250])
          status,body=send("PUT",key=os.environ["KEY"],user_agent="TRELLIS-RunPod-Backup/1.0 (+https://github.com/mleads026-ux/trellis-runpod)")
          print("Authenticated PUT with explicit User-Agent HTTP",status,"body",body.decode("utf-8","replace")[:220])
          assert status==201, "Live Cloudflare Worker PUT failed (see HTTP above)"
          status,downloaded=send("GET",key=os.environ["KEY"],user_agent="TRELLIS-RunPod-Backup/1.0 (+https://github.com/mleads026-ux/trellis-runpod)")
          print("Authenticated GET HTTP",status,"bytes",len(downloaded))
          assert status==200 and downloaded==raw
          print("PASS live GLB upload-download with GitHub storage secret; compare Pod secret separately")
          PY
